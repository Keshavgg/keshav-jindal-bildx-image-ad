version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bildx-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - AI_PROVIDER=${AI_PROVIDER:-fake}
      - MAX_CONCURRENT_PROVIDER_CALLS=${MAX_CONCURRENT_PROVIDER_CALLS:-3}
      - MAX_QUEUE_CAPACITY=${MAX_QUEUE_CAPACITY:-20}
      - PROVIDER_TIMEOUT_SECONDS=${PROVIDER_TIMEOUT_SECONDS:-15.0}
      - IMAGE_DOWNLOAD_TIMEOUT_SECONDS=${IMAGE_DOWNLOAD_TIMEOUT_SECONDS:-10.0}
      - IMAGE_DOWNLOAD_MAX_BYTES=${IMAGE_DOWNLOAD_MAX_BYTES:-10485760}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - RETRY_INITIAL_DELAY_SECONDS=${RETRY_INITIAL_DELAY_SECONDS:-0.5}
      - RETRY_BACKOFF_FACTOR=${RETRY_BACKOFF_FACTOR:-2.0}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - backend-output-ads:/app/output_ads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bildx-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-output-ads:
