[project]
name = "bildx-image-ad-backend"
version = "1.0.0"
description = "Bildx AI Image-Ad Generator Backend"
authors = [{ name = "Keshav Jindal", email = "keshav.jindal.7029@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "pillow>=10.2.0",
    "python-dotenv>=1.0.1",
    "google-genai>=0.1.1",
    "openai>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
